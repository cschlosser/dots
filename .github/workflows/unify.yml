name: Unify dotfiles

on:
  push:
    branches: [pub]
  workflow_dispatch:

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Run unify
        run: bash .github/workflows/unify.sh . unified

      - name: Push to target repo
        run: |
          cd unified
          git remote add target "https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/${{ vars.TARGET_REPO }}.git"
          git push --force target pub:main
